name: Local MVP verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_MODE: demo
      DEMO_MODE: "true"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare synthetic application configuration
        run: cp .env.example .env
      - name: Backend tests on isolated PostgreSQL
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Backend static checks
        run: |
          docker compose -f compose.test.yaml run --rm --no-deps tests ruff check .
          docker compose -f compose.test.yaml run --rm --no-deps tests ruff format --check .
      - name: Deterministic held-out evaluation gate
        run: |
          docker compose -f compose.test.yaml run --rm --no-deps --user "$(id -u):$(id -g)" \
            tests python /evaluations/run.py --check
          docker compose -f compose.test.yaml run --rm --no-deps --user "$(id -u):$(id -g)" \
            tests pytest /evaluations/test_gate.py -p no:cacheprovider
      - name: Frontend build and type check
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run typecheck
          npx playwright install --with-deps chrome
      - name: Start and seed the full application
        run: |
          docker compose up --build -d --wait --wait-timeout 180
          docker compose run --rm seed
          docker compose run --rm seed
      - name: Atlas assessment through the API and worker
        run: python3 scripts/verify_demo.py
      - name: Browser boundary and real-stack journeys
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_REAL_API: "1"
        run: npm run test:e2e
      - name: Diagnostic logs
        if: failure()
        run: |
          docker compose logs --tail 100 api worker tickets migrate frontend
          docker compose -f compose.test.yaml logs --tail 100
      - name: Stop disposable CI containers
        if: always()
        run: |
          docker compose down --volumes
          docker compose -f compose.test.yaml down --volumes
