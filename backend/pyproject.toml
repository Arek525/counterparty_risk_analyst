[project]
name = "counterparty-risk-analyst"
version = "0.1.0"
description = "Evidence-based counterparty assessment backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.7"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterparty"]

[tool.uv]
build-constraint-dependencies = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.6.1.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a disposable PostgreSQL test server"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
